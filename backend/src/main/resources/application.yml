spring:
  main:
    banner-mode: off
  datasource:
    url: jdbc:h2:file:${lore.home}/lore;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  address: 127.0.0.1
  port: 8080

logging:
  level:
    root: WARN
    com.lore: INFO
    # H2 is newer than Flyway's tested list; the "upgrade recommended" warning is noise for users
    org.flywaydb.core.internal.database.base.Database: ERROR

lore:
  # Where Lore keeps its database and config.properties. Override with LORE_HOME.
  home: ${user.home}/.lore
  ai:
    # anthropic (default), bedrock, or none
    provider: anthropic
  anthropic:
    # Default Claude model. Users pay with their own key, so this is the cheaper,
    # faster Sonnet. To use another model, add a line to ~/.lore/config.properties:
    #   anthropic.model=claude-opus-5-5
    model: claude-sonnet-5-5
    # Grades teach-back answers: a small, cheap, fast job. Override with a line
    #   anthropic.grading-model=claude-sonnet-5-5
    # in ~/.lore/config.properties.
    grading-model: claude-haiku-5-5
  aws:
    region: us-east-1
    model-id: anthropic.claude-3-5-sonnet-20241022-v2:0
