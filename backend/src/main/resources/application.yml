spring:
  main:
    banner-mode: off
  datasource:
    # MAX_COMPACT_TIME=0: H2 never moves data or shrinks the file while closing. A close
    # cut off halfway (seen when the JAR was replaced, or at JVM shutdown) left the header
    # pointing past the end of the file, and the database couldn't be opened again.
    # (DB_CLOSE_ON_EXIT=FALSE would also help, but H2 doesn't allow it with AUTO_SERVER,
    # which lets lore ui and lore stop share the database.)
    url: jdbc:h2:file:${lore.home}/lore;AUTO_SERVER=TRUE;MAX_COMPACT_TIME=0
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  address: 127.0.0.1
  port: 8080

logging:
  level:
    root: WARN
    com.lore: INFO
    # H2 is newer than Flyway's tested list; the "upgrade recommended" warning is noise for users
    org.flywaydb.core.internal.database.base.Database: ERROR
    # A startup failure is reported once by Spring (see BrokenDatabaseAnalyzer); these
    # contexts would also warn about it first, with the same error.
    org.springframework.context.annotation.AnnotationConfigApplicationContext: ERROR
    org.springframework.boot.web.servlet.context.AnnotationConfigServletWebServerApplicationContext: ERROR

lore:
  # Where Lore keeps its database and config.properties. Override with LORE_HOME.
  home: ${user.home}/.lore
  ai:
    # anthropic (default), bedrock, or none
    provider: anthropic
  anthropic:
    # Which Claude model does each job. Users pay with their own key, so only Explain,
    # which has to teach, uses Sonnet. Summaries (one line per change, plus the session
    # summary) and teach-back grading are short jobs for the much cheaper Haiku.
    # To change one, add a line to ~/.lore/config.properties, like:
    #   anthropic.explain-model=claude-opus-5-5
    #   anthropic.summary-model=claude-sonnet-5-5
    #   anthropic.grading-model=claude-sonnet-5-5
    explain-model: claude-sonnet-5-5
    summary-model: claude-haiku-5-5
    grading-model: claude-haiku-5-5
  aws:
    region: us-east-1
    model-id: anthropic.claude-3-5-sonnet-20241022-v2:0
