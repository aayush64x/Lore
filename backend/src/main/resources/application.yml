spring:
  main:
    banner-mode: off
  datasource:
    url: jdbc:h2:file:~/.lore/lore;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  address: 127.0.0.1
  port: 8080

logging:
  level:
    root: WARN
    com.lore: INFO

lore:
  aws:
    region: us-east-1
    model-id: anthropic.claude-3-5-sonnet-20241022-v2:0
